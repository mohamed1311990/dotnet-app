name: CI - Build & Push Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BRANCH=${GITHUB_REF_NAME}
          BRANCH_SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_safe=$BRANCH_SAFE" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Helloweb
          file: ./Helloweb/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dotnet_app:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ steps.meta.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dotnet_app:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      
